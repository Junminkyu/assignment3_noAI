{% extends "base.html" %}
{% block content %}
<main class="page">
  <p class="title">Reddit Sarcasm Labeling Task</p>
  <p class="intro">Read ten Reddit comments and decide whether each one is sarcastic or not sarcastic.</p>
  <form class="panel enrollment-form" action="{{ url_for('start_task') }}" method="post">
    <label>Enter your username<input name="participant_id" placeholder="e.g., John Doe" value="{{ participant_id or '' }}" required></label>
    <label>Were you born in the United States?
      <select name="born_in_us" required>
        <option value="" disabled {% if not born_in_us %}selected{% endif %}>Select an option</option>
        <option value="yes" {% if born_in_us == "yes" %}selected{% endif %}>Yes</option>
        <option value="no" {% if born_in_us == "no" %}selected{% endif %}>No</option>
      </select>
    </label>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <button type="submit">Start task</button>
  </form>
</main>
{% endblock %}
